🇸🇬 新国节点 = url-test, 新国节点, interval=600, tolerance=50, img-url=https://raw.githubusercontent.com/baynidn/icons/main/Icon/Area/Singapore.png
# > 订阅节点

[Rule]
# 当配置文件中没有任何有效策略组时，Loon将使用内置的PROXY策略组
# 当配置文件中存在有效的策略组时，内置的PROXY策略组将不再允许被调用，仅可使用用户配置的策略组
# 配置文件已自带远程GEOIP, cn, DIRECT规则，请勿在此添加
# 请勿修改远程CN REGION规则的排序甚至删除
IP-CIDR, 28.0.0.1/8, DIRECT
IP-CIDR, 198.18.0.0/15, DIRECT
IP-CIDR6, fc00::/18, DIRECT

IP-CIDR,0.0.0.0/32,REJECT
IP-CIDR,10.0.0.0/8,DIRECT // 局域网直连
IP-CIDR,172.16.0.0/12,DIRECT // 局域网直连
IP-CIDR,192.168.0.0/16,DIRECT // 局域网直连
FINAL,兜底

