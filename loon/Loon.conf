兜底 = select, 🇭🇰 香港节点, DIRECT, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇺🇸 美国节点, 🇸🇬 新国节点, img-url=https://raw.githubusercontent.com/baynidn/icons/main/Icon/Proxy/Global.png
国内服务 = select, DIRECT, 🇭🇰 香港节点, 🇺🇸 美国节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇸🇬 新国节点, img-url=https://raw.githubusercontent.com/baynidn/icons/main/Icon/App/Microsoft.png
国外服务 = select, 🇭🇰 香港节点, DIRECT, 🇺🇸 美国节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇸🇬 新国节点, img-url=https://raw.githubusercontent.com/baynidn/icons/main/Icon/App/Google.png
国外社交 = select, 🇭🇰 香港节点, DIRECT, 🇺🇸 美国节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇸🇬 新国节点, img-url=https://raw.githubusercontent.com/baynidn/icons/main/Icon/App/Telegram.png
国外媒体 = select, 🇭🇰 香港节点, DIRECT, 🇨🇳 台湾节点, 🇺🇸 美国节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇸🇬 新国节点, img-url=https://raw.githubusercontent.com/baynidn/icons/main/Icon/App/YouTube.png
国内媒体 = select, DIRECT, 🇭🇰 香港节点, 🇨🇳 台湾节点, img-url=https://raw.githubusercontent.com/baynidn/icons/main/Icon/App/bilibili.png
游戏平台 = select, 🇭🇰 香港节点, DIRECT, 🇺🇸 美国节点, 🇯🇵 日本节点, 🇰🇷 韩国节点, 🇸🇬 新国节点, img-url=https://raw.githubusercontent.com/baynidn/icons/main/Icon/App/Game.png
# > 外部节点
🇭🇰 香港节点 = url-test, 香港节点, interval=600, tolerance=50, img-url=https://raw.githubusercontent.com/baynidn/icons/main/Icon/Area/Hong_Kong.png
🇺🇸 美国节点 = url-test, 美国节点, interval=600, tolerance=50, img-url=https://raw.githubusercontent.com/baynidn/icons/main/Icon/Area/United_States.png
