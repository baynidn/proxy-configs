[Host]
# 其余形态：域名=IP / 域名=别名（可加 use-in-proxy）/ 域名=server:地址 / 域名=ip-mode:模式 / IP=IP
ssid: PHICOMM_5G=server: 10.0.0.1

[Rewrite]

# 【脚本】来自 config/loon/Loon.scripts.ini，你自己维护。
[Script]
# 旧式句式（官方明示兼容）；其余参数：requires-body/binary-body-mode/argument/enable；触发词另有 http-response/cron/network-changed
# 【脚本】：母版不带脚本/插件，需要时在此添加

[Plugin]
# 条目参数：enabled/pin/policy/tag（tag=分组标签）
# 【模块】：母版不带脚本/插件，需要时在此添加

# 【中间人解密】ca-p12/ca-passphrase 换成你自己的证书（申请 Loon 证书后导出填入）。
[Mitm]
# > 需要解密 HTTPS 的域名，空=不解密
hostname=
# > 解密用的 CA 证书（你自己的）
ca-p12 = <你的 ca-p12>
# > CA 证书密码
ca-passphrase = <你的证书密码>
# > 是否跳过服务端证书验证
skip-server-cert-verify=false
