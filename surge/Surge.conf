[Script]
# 脚本类型：http-request/http-response/rule/dns/event/cron/generic
# 脚本参数：type/script-path/script-update-interval/timeout/argument/engine/debug/pattern/requires-body/max-size/binary-body-mode/cronexp/event-name/wake-system
# 【脚本】：母版不带脚本/插件，需要时在此添加

[MITM]
skip-server-cert-verify = true
tcp-connection = true
h2 = true
hostname = www.google.cn, api.abema.io, *.zhihu.com, sub.store
ca-p12 = <你的 ca-p12>
ca-passphrase = <你的证书密码>
# 其余 MITM 键（注释=未启用）
# hostname-disabled = *.example.com  # 临时停用的解密主机名单
# ca-keystore-name = MyCert  # 钥匙串证书名（优先于 ca-p12）
# client-source-address = 127.0.0.1  # 只对这些来源启用 MITM
# auto-quic-block = true  # 命中名单的 QUIC 自动拦截回退 H2（默认 true）

# ============================================================
# Tailscale / WireGuard（全注释=未启用，用时按段去掉行首 #）
# 只有 Surge 支持这两个段；Loon / Clash / Stash 不认这种段写法，不要往那边抄。
# 安全提醒：allow-peer-access / advertise-exit-node / advertise-routes / listen-port
# 会把本机开放给对端，打开前先确认管理后台的 ACL 与审批；密钥一律用占位符，绝不写真实密钥进母版。
# ============================================================
# Surge 内置 Tailscale（iOS 5.20.0+）：[Proxy] 里的 Tailscale 策略引用本段。
# 用时：去掉下面每行行首 #，并填 auth-key；或在 App 内策略编辑器里交互登录（iOS 5.21.0+，登录后自动写 interactive-login = true）。
# 注意：auth-key 与 interactive-login 二选一，不能同时写。密钥去 https://login.tailscale.com/admin/settings/keys 生成。
# [Tailscale tailnet]
# auth-key = tskey-auth-替换为你的密钥
# interactive-login = true  # 另一登录方式（二选一）：在 App 内策略编辑器里交互登录，登录后 Surge 自动写这行；不能和 auth-key 同时写
# hostname = surge-iphone
# control-url = https://controlplane.tailscale.com  # 默认控制面，自建控制面才改
# derp-only = false  # true=全部走 DERP 中转，不走直连（默认 false）
# auto-add-magic-dns-rule = true  # 自动加 MagicDNS 后缀与对端地址路由（默认 true）
# exit-node = none  # 用别人的出口节点：none=不用 / auto=仅唯一候选时自动选 / 填对端名或地址指定
# idle-keepalive = 0  # 空闲多久断开会话（秒）；0 或不写=一直在线（默认一直在线）
# prefer-ipv6 = false  # 双栈时优先 IPv6（默认 false）
# dns-server = 100.64.0.53  # 覆盖控制面下发的解析器，一般不用填
# mtu = 1280  # 隧道 MTU（默认 1280）
# --- iOS 6.0.0+ / Mac 6.11.0+ 新增（iOS 5 下写了也无效）---
# allow-peer-access = false  # 接受其他 tailnet 节点向本机发起的连接（默认 false；旧名 accept-incoming 仍兼容）
# advertise-exit-node = false  # 把本机作为出口节点提供给 tailnet，须管理后台批准；隐含 allow-peer-access（默认 false）
# advertise-routes = 192.168.1.0/24  # 把本机作为指定网段的子网路由器，须管理后台批准；隐含 allow-peer-access（默认不填；网段换成你自己的，默认路由用 advertise-exit-node）
#
# Surge WireGuard 策略：[Proxy] 里的 Office WG 引用本段。
# 用时：去掉下面每行行首 #，并填 private-key、self-ip 与 peer（密钥是机密，绝不写真实密钥进母版）。
# [WireGuard office-wg]
# private-key = 替换为你的客户端私钥
# self-ip = 10.20.0.2  # 本机隧道 IPv4 地址（不是网段）；至少 self-ip / self-ip-v6 二选一
# self-ip-v6 = fd00:20::2  # 本机隧道 IPv6 地址（不用 IPv6 就删掉这行）
# dns-server = 10.20.0.1  # 隧道内解析器；填了它，这条策略按“通用代理”测速，不填按点对点测速
# prefer-ipv6 = false  # 双栈时优先 IPv6（默认 false）
# mtu = 1280  # 隧道 MTU（默认 1280，范围 576-1420）
# --- iOS 6.0.0+ / Mac 6.11.0+ 新增（iOS 5 下写了也无效）---
# allow-peer-access = false  # 接受对端经隧道向本机发起的连接（默认 false；旧名 accept-incoming 仍兼容）
# listen-port = 51820  # 在该 UDP 端口监听对端，本机变成 WireGuard 服务端；隐含 allow-peer-access；填了它 underlying-proxy 被忽略（默认不填）
# peer = (public-key = 替换为对端公钥, allowed-ips = "10.20.0.0/24, 192.168.50.0/24", endpoint = vpn.example.com:51820)  # 对端；多个 peer 用逗号隔开或另起一行 peer =
# peer = (public-key = 替换为对端公钥, allowed-ips = 0.0.0.0/0, endpoint = gateway.example.com:51820, keepalive = 25)  # 通用代理示例：allowed-ips 全量 + keepalive 保活
