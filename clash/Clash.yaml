# 节点字段备查（节点走订阅）：通用 name/type/server/port/ip-version/udp/interface-name/routing-mark/tfo/mptcp/dialer-proxy；TLS 类 tls/sni/fingerprint/alpn/skip-cert-verify；smux 类 smux.enabled/protocol/max-connections/min-streams/max-streams/brutal-opts
