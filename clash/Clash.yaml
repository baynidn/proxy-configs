# ---- 分流规则：按 rules.ini 的顺序，内联规则（IP-CIDR/FINAL）在最后 ----
rules:
  - IP-CIDR,0.0.0.0/32,REJECT
  - IP-CIDR,10.0.0.0/8,DIRECT  # 局域网直连
  - IP-CIDR,172.16.0.0/12,DIRECT  # 局域网直连
  - IP-CIDR,192.168.0.0/16,DIRECT  # 局域网直连
  - RULE-SET,Advertising,REJECT  # 去广告
  - RULE-SET,BanAD,REJECT  # 去广告
  - RULE-SET,Apple_All,国内服务  # 苹果-Apple_All
  - RULE-SET,LinkedIn,国内服务  # 微软-LinkedIn
  - RULE-SET,Microsoft,国内服务  # 微软-Microsoft
  - RULE-SET,Xbox,国内服务  # 微软-Xbox
  - RULE-SET,GitHub,国外服务  # GitHub
  - RULE-SET,Google,国外服务  # 谷歌-Google
  - RULE-SET,GoogleFCM,国外服务  # 谷歌-GoogleFCM
  - RULE-SET,AI,AI  # AI 服务
  - RULE-SET,WeChat,DIRECT  # 微信
  - RULE-SET,Facebook,国外社交  # Facebook
  - RULE-SET,Telegram,国外社交  # Telegram
  - RULE-SET,Twitter,国外社交  # Twitter
  - RULE-SET,Instagram,国外社交  # instagram
  - RULE-SET,Bilibili,国内媒体  # 哔哩哔哩
  - RULE-SET,ChinaMedia,国内媒体  # 国内流媒体
  - RULE-SET,YouTube,国外媒体  # YouTube
  - RULE-SET,Netflix,国外媒体  # Netflix
  - RULE-SET,Disney,国外媒体  # Disney+
  - RULE-SET,Twitch,国外媒体  # Twitch
  - RULE-SET,Spotify,国外媒体  # Spotify
  - RULE-SET,TikTok,国外媒体  # TikTok
  - RULE-SET,GlobalMedia,国外媒体  # 国外流媒体
  - RULE-SET,Game,游戏平台  # 游戏平台（13 合 1）
  - RULE-SET,ChinaMax,DIRECT  # 大陆域名直连
  - RULE-SET,Proxy,兜底  # 通用代理
  - MATCH,兜底
