    type: url-test  # 自动测速选最快
    icon: https://raw.githubusercontent.com/baynidn/icons/main/Icon/Area/Hong_Kong.png
    use:
      - "订阅节点"
    filter: "(?i)(?:🇭🇰|香港|(\\b(HK|HKG|Hong)(\\d+)?\\b))"
    url: http://www.gstatic.com/generate_204
    expected-status: 204  # 只有返回 204 才算活，防劫持页误判
