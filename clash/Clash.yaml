    icon: https://raw.githubusercontent.com/baynidn/icons/main/Icon/App/Game.png
    proxies:
      - "🇭🇰 香港节点"
      - "DIRECT"
      - "🇺🇸 美国节点"
      - "🇯🇵 日本节点"
