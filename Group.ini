[Proxy Group]
# 组可选参数（未用到的）：policy-path 远程策略文件 / update-interval 更新间隔（默认 86400）/
# underlying-proxy 经指定策略转发 / external-policy-modifier 外部策略改名 /
# timeout 组测速超时 / evaluate-before-use 首次用时先测速（url-test/fallback/smart）/
# persistent 同主机固定出口（load-balance）/ policy-priority 权重因子（smart）
# 策略组定义流量走哪个出口。改策略组就来改这个文件。
# 格式: 组名 = 类型, 成员1, 成员2, ...
# 类型: select=手动选, smart/url-test=自动测速选最快
# ✈️ 我的节点是 Surge 专用（引用外部订阅），不进 Loon/Clash/Stash
# > 策略组（下面的节点信息需与外部节点对应，若删除了外部节点里的节点，那么在策略组里也要删除。）
AI = select, "🇺🇸 美国节点", "🇭🇰 香港节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新国节点", icon-url=https://raw.githubusercontent.com/baynidn/icons/main/Icon/App/ChatGPT.png, hidden=0, include-all-proxies=0
兜底 = select, "🇭🇰 香港节点", DIRECT, "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇺🇸 美国节点", "🇸🇬 新国节点", hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/baynidn/icons/main/Icon/Proxy/Global.png
国内服务 = select, DIRECT, "🇭🇰 香港节点", "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新国节点", icon-url=https://raw.githubusercontent.com/baynidn/icons/main/Icon/App/Microsoft.png, hidden=0, include-all-proxies=0
国外服务 = select, "🇭🇰 香港节点", DIRECT, "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新国节点", icon-url=https://raw.githubusercontent.com/baynidn/icons/main/Icon/App/Google.png, hidden=0, include-all-proxies=0
国外社交 = select, "🇭🇰 香港节点", DIRECT, "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新国节点", icon-url=https://raw.githubusercontent.com/baynidn/icons/main/Icon/App/Telegram.png, hidden=0, include-all-proxies=0
国外媒体 = select, "🇭🇰 香港节点", DIRECT, "🇨🇳 台湾节点", "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新国节点", icon-url=https://raw.githubusercontent.com/baynidn/icons/main/Icon/App/YouTube.png, hidden=0, include-all-proxies=0
国内媒体 = select, DIRECT, "🇭🇰 香港节点", "🇨🇳 台湾节点", icon-url=https://raw.githubusercontent.com/baynidn/icons/main/Icon/App/bilibili.png, hidden=0, include-all-proxies=0
游戏平台 = select, "🇭🇰 香港节点", DIRECT, "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新国节点", icon-url=https://raw.githubusercontent.com/baynidn/icons/main/Icon/App/Game.png, hidden=0, include-all-proxies=0
# > 外部节点
🇭🇰 香港节点 = smart, include-other-group="✈️ 我的节点", hidden=1, include-all-proxies=0, policy-regex-filter=(?i)(?!.*(群组|更新|官网|下载|剩余))(?:🇭🇰|香港|(\b(HK|HKG|Hong)(\d+)?\b)), icon-url=https://raw.githubusercontent.com/baynidn/icons/main/Icon/Area/Hong_Kong.png
🇺🇸 美国节点 = smart, include-other-group="✈️ 我的节点", hidden=1, include-all-proxies=0, policy-regex-filter=(?i)(?!.*(群组|更新|官网|下载|剩余))(?:🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(\b(US|USA|United States)(\d+)?\b)), icon-url=https://raw.githubusercontent.com/baynidn/icons/main/Icon/Area/United_States.png
