# > 订阅节点
✈️ 我的节点 = select, hidden=0, include-all-proxies=1, icon-url=https://raw.githubusercontent.com/baynidn/icons/main/Icon/Proxy/Final.png, policy-regex-filter=^(?=.*(.*))(?!.*((?i)下载|频道|软件|维护|没有|回家|关注|回国|校园|教育|久虚|IPV6|邀请|地址|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|群|贩卖|通知|倒卖|防止|国内|unblock|music|云音乐|🎧|🎮|公告|剩余|防走失|失联|续费|充值|套餐|余额|订单|优惠|活动|广告|试用|体验|停用|失效|发布|永久|搬家|(\b(GAME|USE|USED|TOTAL|EXPIRE|EMAIL|Panel)\b|(\d{4}-\d{2}-\d{2}|\dG)))).*$
