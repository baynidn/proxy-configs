# ============================================================
# Stash 配置（官方字段版 · 全字段注释版）
# ------------------------------------------------------------
# 重要：Stash 是 Clash Premium 兼容内核，不是 Mihomo。
# 本文件只写 Stash 官方文档（stash.wiki）明确支持的字段。
# 字段来源：https://stash.wiki/configuration/example-config 等官方页
# 使用前替换占位符：<你的订阅地址> = 节点订阅链接
# 三端说明：本文件 iOS / 安卓 / PC 三端通用，无需任何修改——Stash 没有 tun 段，
#   虚拟网卡由各平台 App 自己接管。
# ============================================================

# ---- 节点订阅（proxy-providers）：Stash 只认下面这几个字段 ----
proxy-providers:
  订阅节点:
    url: "<你的订阅地址>"  # 订阅链接
    interval: 3600  # 自动更新间隔（秒）
    path: ./proxies/dingyue.yaml  # 本地缓存路径（只能在 Stash 资源目录内；只写 path 不写 url = 本地静态文件，不更新）
    # filter: "香港|HK"  # 只收名字匹配的节点（正则）
    filter: "^(?=.*(.*))(?!.*((?i)下载|频道|软件|维护|没有|回家|关注|回国|校园|教育|久虚|IPV6|邀请|地址|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|群|贩卖|通知|倒卖|防止|国内|unblock|music|云音乐|🎧|🎮|公告|剩余|防走失|失联|续费|充值|套餐|余额|订单|优惠|活动|广告|试用|体验|停用|失效|发布|永久|搬家|(\\b(GAME|USE|USED|TOTAL|EXPIRE|EMAIL|Panel)\\b|(\\d{4}-\\d{2}-\\d{2}|\\dG)))).*$"  # 排除信息假节点（前瞻写法，Stash 支持；与 Surge 的 ✈️ 名单同一份）。想只收某类节点就换成上面示例的正向写法，二选一
    headers:  # 更新订阅时附加的请求头（注意是复数 headers，与 Mihomo 的单数 header 不同）
      User-Agent:
        - "Stash"
    benchmark-url: http://www.gstatic.com/generate_204  # 本订阅全部节点的统一测速地址
    benchmark-timeout: 5  # 测速超时（秒）

# ---- 基础 ----
mode: rule  # 分流模式：rule=按规则(推荐) / global=全局代理 / direct=全局直连
log-level: info  # 日志级别：silent/info/warning/error/debug
ipv6: false  # false=Stash 自身解析只走 IPv4 且不给应用返回 AAAA。推荐 false

# ---- 自定义 hosts（支持通配：*.example.com 子域 / .example.com 子域+自身） ----
# hosts:
#   'nas.home': 192.168.1.10
#   '*.internal.example.com': 10.0.0.2

# ---- DNS（Stash 只有 Fake-IP 一种模式，没有 enhanced-mode 这个字段） ----
dns:
  default-nameserver:  # 兜底 DNS：解析下面加密 DNS 的域名用；非 system 的条目必须是纯 IP
    - 223.5.5.5
    - 119.29.29.29
  nameserver:  # 主 DNS：支持 UDP/TCP/DoT/DoH/DoH3/DoQ 与 system；全部服务器并发查询、取最快（官方建议不超过 2 个）
    - https://223.5.5.5/dns-query
    - 119.29.29.29
  nameserver-policy:  # 按域名指定 DNS：精确 > 通配 > 集合（geosite: / rule-set:，可逗号组合）
    'geosite:cn,private': https://223.5.5.5/dns-query
  proxy-server-nameserver:  # 专门解析「节点服务器域名」的 DNS：避免递归解析、节点域名解析更准（3.6+）
    - https://223.5.5.5/dns-query
  fallback:  # 备用 DNS：与主 DNS 并发查询，由 fallback-filter 决定采信谁
    - https://1.12.12.12/dns-query
  fallback-filter:  # 采信判定（Stash 只支持这四项，没有 geosite 项）
    geoip: true
    geoip-code: CN  # 默认 CN：结果是中国 IP 就信主 DNS
    ipcidr:
      - 240.0.0.0/4
    domain:
      - '+.google.com'
      - '+.youtube.com'
  fake-ip-range: 198.18.0.1/16  # fake-ip 地址池（默认值，别乱改）
  fake-ip-filter:  # 这些域名返回真实 IP（支持通配 + geosite: / rule-set: 条目）
    - '*.lan'
    - '*.local'
    - 'localhost'
    - 'geosite:private'
  ipv6: false  # false=只屏蔽给应用的 AAAA 回答（与顶层 ipv6 分工不同，这里管回答、顶层管自身解析）
  skip-cert-verify: false  # 加密 DNS 的证书验证跳过（个别 DoH 兼容问题时才开）
  # follow-rule: true  # DNS 查询改为按分流规则转发（相当于 Mihomo 的 respect-rules）；官方不建议开（易递归），保持注释


proxies: []   # 不用订阅的话，在这里手动粘贴节点

