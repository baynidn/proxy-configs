[Rule]
# 规则类型全集：DOMAIN/DOMAIN-SUFFIX/DOMAIN-KEYWORD/DOMAIN-WILDCARD/DOMAIN-SET/RULE-SET/IP-CIDR/IP-CIDR6/GEOIP/IP-ASN/USER-AGENT/URL-REGEX/PROCESS-NAME/DEST-PORT/SRC-PORT/IN-PORT/SRC-IP/DEVICE-NAME/MAC-ADDRESS/PROTOCOL/HOSTNAME-TYPE/SUBNET/CELLULAR-RADIO/CELLULAR-CARRIER/AND/OR/NOT/SCRIPT/FINAL
# 规则参数：no-resolve/dns-failed/extended-matching/pre-matching/notification-text/notification-interval/update-interval/requires-resolve/always-capture
# 分流规则决定每个请求走哪个策略组。改规则就来改这个文件。
# RULE-SET,URL,策略 -> 远端规则集（自动转 Loon [Remote Rule]）
# RULE-SET,本地文件,策略 -> 本地规则集（自动转 Loon [Remote Rule]，只写文件名）
# 其他行（IP-CIDR/FINAL等）-> 直接进 Surge [Rule]，也进 Loon [Rule]
# 注意：FINAL 只能有一条，必须在最后
# AND,((PROTOCOL,UDP), (DEST-PORT,443)),REJECT-NO-DROP // bilibili
# --------------------------------
# 防止应用循环请求
IP-CIDR,0.0.0.0/32,REJECT
# --------------------------------
